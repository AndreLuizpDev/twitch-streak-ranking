<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ranking dos maiores streaks de inscritos do canal da Twitch mrfalll."
    />
    <title>Ranking de Streaks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-icon">🔥</div>
          <div>
            <!-- <p class="eyebrow">Canal oficial</p> -->
            <h1>Ranking de Streaks</h1>
          </div>
        </div>
        <a
          id="channelLink"
          class="channel-link"
          href="#"
          target="_blank"
          rel="noreferrer"
        >
          @carregando...
        </a>
      </header>

      <main class="container">
        <section class="hero">
          <div>
            <p id="topSubtitle" class="subtitle">Top 50 maiores streaks</p>
          </div>
          <button id="refreshButton" class="refresh-button" type="button">
            <span class="button-icon">↻</span>
            Atualizar
          </button>
        </section>

        <!-- Settings modal (channel + limit) -->
        <div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
          <div class="modal-backdrop" id="modalBackdrop"></div>
          <div class="modal-panel" role="document">
            <h3>Configurar consulta</h3>
            <form id="settingsForm">
              <label for="channelInput">Canal (ex: mrfalll)</label>
              <input id="channelInput" name="channel" type="text" placeholder="mrfalll" required />

              <label for="limitInput">Limite dados</label>
              <input id="limitInput" name="limit" type="number" min="1" step="1" required />

              <div class="modal-actions">
                <button type="button" id="cancelSettings" class="btn">Cancelar</button>
                <button type="submit" id="saveSettings" class="btn primary">Aplicar e Atualizar</button>
              </div>
            </form>
          </div>
        </div>

        <section class="ranking-panel">
          <div class="list-header">
            <span>Posição</span>
            <span>Usuário</span>
            <span>Streak</span>
            <span>Última atualização</span>
          </div>
          <div id="rankingList" class="ranking-list" aria-live="polite"></div>
        </section>

        <div id="statusBar" class="status-bar" aria-live="polite"></div>
        
      </main>
      <footer class="site-footer">
        <div class="footer-inner">
          <span id="projectVersion">v0.0.0</span>
          <span class="footer-links">API: <a id="apiRepoLink" href="https://github.com/TomGoulart" target="_blank" rel="noreferrer">TomGoulart</a> • Site: <a id="siteRepoLink" href="https://github.com/AndreLuizpDev" target="_blank" rel="noreferrer">AndreLuizpDev</a></span>
        </div>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
